<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5BF0"/>
      <stop offset="0.55" stop-color="#3E8EF0"/>
      <stop offset="1" stop-color="#16C7B5"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0a1a3a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- rounded-square app tile -->
  <g filter="url(#soft)">
    <rect x="86" y="86" width="852" height="852" rx="196" fill="url(#bg)"/>
  </g>
  <rect x="86" y="86" width="852" height="852" rx="196" fill="url(#gloss)"/>

  <!-- microphone (left) -->
  <g fill="#ffffff" filter="url(#soft)">
    <rect x="276" y="250" width="150" height="270" rx="75"/>
    <path d="M250 452 v18 a101 101 0 0 0 202 0 v-18" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
    <rect x="336" y="586" width="30" height="92" rx="15"/>
    <rect x="286" y="668" width="130" height="30" rx="15"/>
  </g>

  <!-- transcript lines (right) -->
  <g fill="#ffffff" filter="url(#soft)">
    <rect x="540" y="330" width="300" height="40" rx="20"/>
    <rect x="540" y="412" width="250" height="40" rx="20"/>
    <rect x="540" y="494" width="190" height="40" rx="20" fill-opacity="0.85"/>
  </g>
</svg>
